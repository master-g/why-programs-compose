<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- 组合三角形:A→B→C 两段灰,g∘f 直达边用 coral;颜色随明暗主题切换 -->
  <style>
    .node { fill: #141413; }
    .edge { stroke: #6c6a64; }
    .compose { stroke: #cc785c; }
    @media (prefers-color-scheme: dark) {
      .node { fill: #deddd6; }
      .edge { stroke: #aaa9a1; }
      .compose { stroke: #e28466; }
    }
  </style>
  <g fill="none" stroke-width="5" stroke-linecap="round">
    <line class="edge" x1="16.1" y1="43.1" x2="27.9" y2="22.9" />
    <line class="edge" x1="36.1" y1="22.9" x2="47.9" y2="43.1" />
    <line class="compose" x1="20.5" y1="50" x2="43.5" y2="50" stroke-width="6" />
  </g>
  <circle class="node" cx="12" cy="50" r="6.5" />
  <circle class="node" cx="32" cy="16" r="6.5" />
  <circle class="node" cx="52" cy="50" r="6.5" />
</svg>
