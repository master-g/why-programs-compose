<svg data-svg-theme="paper-ink-v1" width="360" height="200" viewBox="0 0 360 200" xmlns="http://www.w3.org/2000/svg">
<style>
  .svg-axis-fill { fill: #b8b2a8; }
  .svg-axis-stroke { stroke: #b8b2a8; }
  .svg-coral-text-fill { fill: #a9583e; }
  .svg-ink-fill { fill: #312f2f; }
  .svg-ink-stroke { stroke: #312f2f; }
  .svg-muted-fill { fill: #6c6a64; }
  @media (prefers-color-scheme: dark) {
    .svg-axis-fill { fill: #8b8a83; }
    .svg-axis-stroke { stroke: #8b8a83; }
    .svg-coral-text-fill { fill: #dc896d; }
    .svg-ink-fill { fill: #f0efe8; }
    .svg-ink-stroke { stroke: #f0efe8; }
    .svg-muted-fill { fill: #aaa9a1; }
  }
</style>
  <defs>
    <marker id="a-ink" markerWidth="7" markerHeight="7" refX="6.5" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L7,3 z"  class="svg-ink-fill"/>
    </marker>
    <marker id="a-axis" markerWidth="7" markerHeight="7" refX="6.5" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L7,3 z"  class="svg-axis-fill"/>
    </marker>
  </defs>

  <!-- 渲染回归用极简测试图:轴线 + 箭头 + 中文与数学标签 -->
  <line x1="40" y1="160" x2="330" y2="160"  stroke-width="1" marker-end="url(#a-axis)" class="svg-axis-stroke"/>
  <line x1="40" y1="160" x2="40" y2="25"  stroke-width="1" marker-end="url(#a-axis)" class="svg-axis-stroke"/>
  <text x="336" y="164" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="13"  class="svg-muted-fill">x</text>
  <text x="32" y="17" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="13"  class="svg-muted-fill">y</text>

  <line x1="40" y1="160" x2="180" y2="72"  stroke-width="1.8" marker-end="url(#a-ink)" class="svg-ink-stroke"/>
  <circle cx="40" cy="160" r="2.6"  class="svg-ink-fill"/>
  <text x="96" y="100" font-family="system-ui, -apple-system, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="12.5"  class="svg-ink-fill">测试箭头</text>
  <text x="188" y="68" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="14"  class="svg-coral-text-fill">v = (3, 2)</text>
</svg>
