# 空词条即 TODO:写过的词条从 known_absent 移除。
# 结构:parts(部分)> sections(章)> entries(词条)。词条顺序 = 教学引入顺序;允许直觉先行、形式化后置的局部前向提示。
# 概念骨架蒸馏自 Bartosz Milewski《Category Theory for Programmers》三部分结构;
# 代码语言约定:Rust 为主,Haskell 仅在类型类/惰性/高阶类型的表达力对照处保留,不出现 C++。
parts:
  - id: foundations
    name_zh: 记号地基
    name_en: "Notation Foundations"
    order: 0
    description_zh: |
      读懂本库所需的最小前置:集合与函数的记号、Haskell 记号速读、Rust 泛型与 trait 速查。每条独立成篇,主线词条直接引用,不重复讲。
  - id: categories
    name_zh: 范畴基础
    name_en: "Categories"
    order: 1
    description_zh: |
      从『组合是编程的本质』出发:范畴、态射、类型与函数、幺半群、Kleisli 范畴,直到泛构造给出的积与余积。
  - id: functors
    name_zh: 函子与代数数据类型
    name_en: "Functors and ADTs"
    order: 2
    description_zh: |
      保结构的映射:代数数据类型、函子及其法则、函子性、函数类型,收束于自然变换。
  - id: structure
    name_zh: 结构
    name_en: "Structure"
    order: 3
    description_zh: |
      用泛性质统一此前的一切:极限与余极限、自由结构、可表示函子,顶点是 Yoneda 引理。
  - id: composition-at-scale
    name_zh: 高阶组合
    name_en: "Composition at Scale"
    order: 4
    description_zh: |
      伴随、单子与 F-代数:副作用如何被组合驯服,折叠为何是普适的,以及通往更深处的几扇门。

